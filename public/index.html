<!DOCTYPE html>
<html lang="hr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PhotoDiary</title>
  <link rel="manifest" href="/manifest.json">
  <link rel="stylesheet" href="/styles.css">
  <meta name="theme-color" content="#2196F3">
</head>
<body>
  <div class="container">
    <h1>PhotoDiary</h1>
    
    <div class="camera-section">
      <video id="video" autoplay playsinline></video>
      <canvas id="canvas"></canvas>
      <button id="startCamera">Otvori kameru</button>
      <button id="takePhoto" style="display:none;">Slikaj</button>
    </div>

    <div id="photoPreview"></div>

    <form id="noteForm">
      <textarea id="noteText" placeholder="Opis fotografije (obavezno)..." rows="3" required></textarea>
      <button type="submit">Spremi bilješku</button>
    </form>

    <h2>Spremljene bilješke</h2>
    <div id="notes"></div>
  </div>

  <script src="/app.js"></script>
</body>
